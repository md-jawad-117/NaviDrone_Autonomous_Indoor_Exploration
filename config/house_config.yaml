# Config for flying the drone inside the converted house mesh (env/house_world.py),
# as opposed to the procedural box-obstacle room in config/env_config.yaml.

drone:
  # Clear patch of floor away from the dining set (~x8-10.7,y2-3.6) and both
  # beds (~x0.5-2.1,y7-9.1 and x9-10.6,y8.4-10.4) -- see room bounds x:[0.4,10.8]
  # y:[0.4,12.2] z:[0,2.4].
  start_position: [5.5, 5.5, 1.0]
  start_yaw_deg: 0.0
  max_linear_speed: 2.2       # was 1.2, then 1.8
  max_vertical_speed: 0.8
  max_yaw_rate_deg: 60.0

camera:
  width: 320
  height: 240
  fov_deg: 90.0
  near: 0.05
  far: 20.0
  mount_offset: [0.11, 0.0, 0.0]
  tilt_deg: 0.0
  rgb_noise_std: 0.0
  depth_noise_std: 0.0

sim:
  timestep: 0.008333333
  gui: true
  # Wall-clock pacing only -- does NOT affect physics accuracy (PyBullet's own
  # timestep above is unchanged, so the sim is stepped identically either way).
  # 1.0 = real-time playback (1 sim-second takes ~1 real second). Raised to
  # 10.0 (finishes ~10x faster in wall-clock time) after confirming it looks
  # fine -- the drone visibly moves faster on screen than real-time, less
  # smooth to watch live, but the whole route completes much sooner.
  speed_multiplier: 10.0
