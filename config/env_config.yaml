# World, drone and camera parameters. Nothing here is hardcoded in source.

world:
  difficulty: sparse        # sparse | moderate | dense
  room_size: [10.0, 10.0]    # meters, x/y extent of the room
  wall_height: 3.0
  ground_texture: checker    # checker | plain  (checker gives ORB features something to grab)
  seed: 42

drone:
  start_position: [0.0, 0.0, 1.0]
  start_yaw_deg: 0.0
  max_linear_speed: 1.5      # m/s, body-frame x/y
  max_vertical_speed: 1.0    # m/s, body-frame z
  max_yaw_rate_deg: 60.0     # deg/s

camera:
  width: 320
  height: 240
  fov_deg: 90.0
  near: 0.05
  far: 20.0
  mount_offset: [0.11, 0.0, 0.0]   # forward of drone center, meters
  tilt_deg: 0.0                     # 0 = level, positive tilts down
  rgb_noise_std: 0.0                 # 0-255 scale, set >0 in Phase 2
  depth_noise_std: 0.0                # meters, set >0 in Phase 2

sim:
  timestep: 0.008333333       # 1/120 s
  gui: true
